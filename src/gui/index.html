<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>raw-coding-agent</title>
<link rel="stylesheet" href="/common.css">
<style>
  body { height: 100vh; display: flex; flex-direction: column; }
  .layout { flex: 1; display: flex; min-height: 0; }
  aside { width: 280px; flex: none; border-right: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; }
  .new { padding: 12px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
  .new input[type=text] { flex: 1; min-width: 0; font: 12px var(--mono); padding: 0 8px; height: 30px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); }
  .new input[type=text]:focus { outline: none; border-color: var(--accent); }
  .open-row { display: flex; gap: 6px; }
  .open-row[hidden] { display: none; }
  .open-row button { height: 30px; flex: none; }
  .side-foot label { display: inline-flex; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); cursor: pointer; }
  #sessions { flex: 1; overflow-y: auto; }
  .new > button { text-align: left; border-style: dashed; color: var(--muted); height: 30px; }
  .new > button:hover { color: var(--ink); }
  .side-foot { padding: 10px 12px; border-top: 1px solid var(--line); }
  .ctx-warn { color: var(--warn); }
  .ws-head { display: flex; align-items: center; gap: 6px; padding: 0 8px; height: 34px; background: var(--soft); border-block: 1px solid var(--line); margin-top: -1px;
             font-size: 13px; font-weight: 600; cursor: pointer; user-select: none; position: sticky; top: 0; z-index: 1; }
  .ws-head .caret { width: 12px; color: var(--muted); font-weight: 400; font-size: 12px; }
  .ws-head .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ws-head .count { color: var(--muted); font-weight: 400; font-size: 12px; font-variant-numeric: tabular-nums; }
  .ws-head button { font-size: 12px; padding: 0 8px; font-weight: 400; height: 22px; }
  .ws-head button.x { border: 0; background: none; color: var(--muted); padding: 0 4px; visibility: hidden; }
  .ws-head:hover button.x { visibility: visible; }
  .ws-head.current .name { color: var(--accent); }
  /* Level 2: a workspace (the project directory, or one of its worktrees) inside a project. */
  .ws-head.sub { position: static; background: none; border: 0; margin: 0; height: 30px; padding-left: 22px; font-weight: 500; }
  .ws-head.sub:hover { background: var(--soft); }
  .ws-head .branch { font: 12px var(--mono); color: var(--muted); font-weight: 400; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 45%; }
  .ws-head .dirty { color: var(--warn); font-weight: 400; font-size: 12px; flex: none; }
  .ws-head .gone { color: var(--err); font-weight: 400; font-size: 12px; flex: none; }
  .ws-head.sub button { visibility: hidden; }
  .ws-head.sub:hover button, .ws-head.sub.current button { visibility: visible; }
  .ws-empty { padding: 4px 12px 8px 40px; font-size: 12px; color: var(--muted); }
  .item { display: block; padding: 8px 12px 8px 26px; color: var(--ink); cursor: pointer; }
  .in-ws .item { padding-left: 40px; }
  dialog { border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--ink); padding: 18px 20px; width: 420px; box-shadow: 0 8px 32px rgb(0 0 0 / .18); }
  dialog::backdrop { background: rgb(0 0 0 / .25); }
  dialog [hidden] { display: none !important; }
  dialog h3 { margin: 0 0 4px; font-size: 16px; }
  dialog p { margin: 0 0 12px; font-size: 12px; color: var(--muted); }
  dialog form { display: flex; flex-direction: column; gap: 10px; max-width: none; align-items: stretch; }
  dialog label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
  dialog label.radio { flex-direction: row; align-items: center; gap: 6px; color: var(--ink); font-size: 13px; }
  dialog input[type=text], dialog select { font: 13px var(--mono); padding: 0 8px; height: 30px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); }
  dialog .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 6px; }
  dialog .row button { height: 32px; }
  dialog .hint { font-size: 12px; color: var(--muted); }
  dialog .err-text { font-size: 12px; }
  dialog .pair { display: flex; gap: 6px; }
  dialog .pair select { flex: 1; }
  dialog .pair input { width: 110px; }
  dialog .pair input[hidden] { display: none; }
  .ws-head .spend { font-weight: 400; font-size: 12px; color: var(--muted); flex: none; font-variant-numeric: tabular-nums; }
  .ws-head .spend.near { color: var(--warn); }
  .ws-head .spend.over { color: var(--err); }
  .item:hover { background: var(--soft); text-decoration: none; }
  .item.active { background: var(--soft); box-shadow: inset 3px 0 0 var(--accent); }
  .item .title { display: flex; gap: 6px; align-items: center; font-size: 13px; }
  .item .title .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .sub { color: var(--muted); font-size: 12px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
  .badge { font-size: 12px; color: var(--muted); flex: none; }
  .chat { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .chat-head { padding: 0 18px; height: 44px; flex: none; border-bottom: 1px solid var(--line); display: flex; gap: 10px; align-items: center; font-size: 13px; }
  .chat-head .dot.none { visibility: hidden; }
  .chat-head .title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 40%; }
  #head-links { display: flex; gap: 6px; font-size: 13px; white-space: nowrap; color: var(--muted); }
  #head-links a { color: var(--muted); }
  #head-links a:hover { color: var(--ink); }
  .mode { display: inline-flex; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); cursor: pointer; white-space: nowrap;
          border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; }
  .mode.auto { color: var(--warn); border-color: var(--warn); background: var(--warn-bg); }
  .mode[hidden] { display: none; }
  .note { color: var(--muted); font-size: 12px; }
  main { flex: 1; overflow-y: auto; padding: 24px 0; }
  #log { max-width: 760px; margin: 0 auto; padding: 0 18px; display: flex; flex-direction: column; gap: 12px; }
  .msg { white-space: pre-wrap; word-break: break-word; }
  .user { align-self: flex-end; max-width: 80%; background: var(--soft); border: 1px solid transparent; padding: 8px 12px; border-radius: 10px; }
  .user .tag { display: block; font-size: 12px; color: var(--muted); margin-top: 4px; text-align: right; }
  .user.queued { border-style: dashed; border-color: var(--muted); }
  .user.dropped { color: var(--muted); text-decoration: line-through; }
  button.stop { border-color: var(--err); color: var(--err); }
  button.stop[hidden] { display: none; }
  .md { white-space: normal; line-height: 1.7; }
  .md > :first-child { margin-top: 0; }
  .md > :last-child { margin-bottom: 0; }
  .md p, .md ul, .md ol, .md blockquote, .md pre, .md .table-wrap { margin: 0 0 10px; }
  .md h1, .md h2, .md h3, .md h4, .md h5, .md h6 { margin: 18px 0 8px; line-height: 1.35; font-weight: 600; }
  .md h1 { font-size: 1.4em; } .md h2 { font-size: 1.25em; } .md h3 { font-size: 1.1em; } .md h4, .md h5, .md h6 { font-size: 1em; }
  .md ul, .md ol { padding-left: 1.6em; }
  .md li { margin: 2px 0; }
  .md li > ul, .md li > ol, .md li > p { margin: 4px 0; }
  .md blockquote { padding: 2px 12px; border-left: 3px solid var(--line); color: var(--muted); }
  .md hr { border: none; border-top: 1px solid var(--line); margin: 14px 0; }
  .md code { font: 0.85em var(--mono); background: var(--soft); border-radius: 4px; padding: 0 4px; }
  .md pre { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 10px; overflow-x: auto; font: 12px/1.5 var(--mono); white-space: pre; }
  .md pre code { font: inherit; background: none; padding: 0; }
  .md .table-wrap { overflow-x: auto; }
  .md table { border-collapse: collapse; font-size: 13px; }
  .md th, .md td { border: 1px solid var(--line); padding: 5px 10px; text-align: left; vertical-align: top; }
  .md th { background: var(--soft); font-weight: 600; }
  /* Consecutive tool calls form one timeline: a thin rail, one line per call, details on click. */
  .tools > .list { display: flex; flex-direction: column; border-left: 1px solid var(--line); margin-left: 4px; padding-left: 6px; }
  .tools > summary { cursor: pointer; list-style: none; font-size: 12px; color: var(--muted); padding: 2px 8px; border-radius: 6px; width: fit-content; }
  .tools > summary::-webkit-details-marker { display: none; }
  .tools > summary::before { content: "▸ "; }
  .tools[open] > summary { margin-bottom: 2px; }
  .tools[open] > summary::before { content: "▾ "; }
  .tools > summary:hover { background: var(--soft); color: var(--ink); }
  .tools > summary .fails { color: var(--err); }
  .tool summary { cursor: pointer; padding: 2px 8px; border-radius: 6px; font: 12px/1.7 var(--mono); color: var(--muted); list-style: none; display: flex; gap: 8px; }
  .tool summary::-webkit-details-marker { display: none; }
  .tool summary::before { content: "▸"; width: 10px; flex: none; }
  .tool[open] summary::before { content: "▾"; }
  .tool summary:hover { background: var(--soft); color: var(--ink); }
  .tool summary .label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tool summary .state { flex: none; }
  .tool.running summary, .tool.waiting summary { color: var(--ink); }
  .tool.running summary .state, .tool.waiting summary .state { color: var(--warn); }
  .tool.error summary, .tool.error summary .state { color: var(--err); }
  .tool .body { margin: 2px 0 8px 18px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); overflow: hidden; }
  .tool pre { margin: 0; padding: 8px 10px; max-height: 360px; overflow: auto; font: 12px/1.5 var(--mono); white-space: pre-wrap; word-break: break-all; }
  .tool pre + pre { border-top: 1px solid var(--line); }
  .tool .input { color: var(--muted); }
  /* A call waiting for approval is the one thing on the page that needs you: give it room. */
  .tool.waiting { margin: 6px 0; }
  .tool.waiting .body { border-color: var(--warn); }
  .tool.waiting .input { color: var(--ink); font-size: 13px; padding: 12px; }
  .approval { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-top: 1px solid var(--line); background: var(--warn-bg); color: var(--warn); font-size: 13px; }
  .approval span { flex: 1; }
  .tool.danger .body { border-color: var(--err); }
  .tool.danger .approval { color: var(--err); }
  .tool.danger button.primary { background: var(--err); border-color: var(--err); }
  button.link { border: 0; background: none; color: var(--muted); padding: 4px 6px; }
  button.link:hover:not(:disabled) { color: var(--ink); text-decoration: underline; }
  .end { color: var(--muted); font-size: 12px; padding: 0 0 8px; }
  .end.bad { color: var(--err); }
  .err { color: var(--err); white-space: pre-wrap; font: 12px/1.5 var(--mono); border-left: 2px solid var(--err); padding: 2px 0 2px 10px; }
  .empty { color: var(--muted); text-align: center; margin-top: 18vh; }
  .start { margin: 18vh auto 0; width: 100%; max-width: 520px; display: flex; flex-direction: column; gap: 8px; }
  .start h2 { font-size: 20px; font-weight: 600; margin: 0; }
  .start p { margin: 0 0 12px; color: var(--muted); font-size: 13px; }
  .start button { display: flex; flex-direction: column; gap: 2px; text-align: left; padding: 12px 16px; }
  .start button .name { font-size: 16px; font-weight: 600; }
  .start button .path { color: var(--muted); font: 12px var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
  .start .keys { margin-top: 16px; font-size: 12px; color: var(--muted); }
  kbd { font: 12px var(--mono); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; background: var(--panel); }
  .no-session .chat-head, .no-session footer { display: none; }
  .menu { position: fixed; z-index: 10; min-width: 180px; padding: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
          box-shadow: 0 4px 16px rgb(0 0 0 / .12); display: flex; flex-direction: column; }
  .menu button { border: 0; background: none; text-align: left; padding: 6px 10px; border-radius: 4px; font-size: 13px; }
  .menu button:hover:not(:disabled) { background: var(--soft); }
  .menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }
  .toast { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); z-index: 11; padding: 6px 14px; border-radius: 6px;
           background: var(--ink); color: var(--panel); font-size: 13px; pointer-events: none; }
  #head-links button { font-size: 12px; padding: 1px 8px; }
  footer { border-top: 1px solid var(--line); background: var(--panel); padding: 12px 18px; }
  form { max-width: 860px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; }
  form button { height: 40px; border-radius: 6px; padding: 0 16px; }
  textarea { flex: 1; resize: none; font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; min-height: 40px; max-height: 200px; }
  textarea:focus { outline: none; border-color: var(--accent); }
  textarea:disabled { opacity: .6; }
  /* Pasted images waiting to be sent, and the ones shown in a sent message. */
  .attachments { max-width: 860px; margin: 0 auto 8px; display: flex; flex-wrap: wrap; gap: 8px; }
  .attachments[hidden] { display: none; }
  .attachment { position: relative; width: 64px; height: 64px; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--bg); }
  .attachment img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .attachment button { position: absolute; top: 2px; right: 2px; width: 18px; height: 18px; padding: 0; border-radius: 50%; border: 0;
                       background: rgb(0 0 0 / .6); color: #fff; font-size: 12px; line-height: 18px; }
  footer.dragging textarea { border-color: var(--accent); border-style: dashed; }
  .user .imgs { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
  .user .imgs:not(:last-child) { margin-bottom: 6px; }
  .user .imgs img { max-width: 200px; max-height: 160px; border-radius: 6px; border: 1px solid var(--line); display: block; cursor: zoom-in; }
</style>
</head>
<body>
<div class="topbar">
  <h1>raw-coding-agent</h1>
  <nav><a id="nav-stats" href="#">统计</a><a data-page="/iterations" href="#">迭代记录</a></nav>
</div>
<div class="layout" id="root">
  <aside>
    <div class="new">
      <button id="ws-add" type="button">+ 打开项目</button>
      <div class="open-row" id="ws-form" hidden>
        <input type="text" id="ws-path" placeholder="项目路径，或点右边选择">
        <button id="ws-open" type="button" title="弹出系统的文件夹选择框">选择…</button>
      </div>
    </div>
    <div id="sessions"></div>
    <div class="side-foot">
      <label title="之后用 “+ 新会话” 建的会话默认不再逐个询问 bash；每个会话可以在顶部单独切换"><input type="checkbox" id="new-auto"> 新会话自动批准 bash</label>
    </div>
  </aside>
  <section class="chat">
    <div class="chat-head">
      <span class="dot" id="dot"></span>
      <span class="title" id="head-title"></span>
      <span class="meta grow" id="meta"></span>
      <label class="mode" id="mode" hidden title="本会话的权限设置，立即生效（包括正在等待批准的调用）">
        <input type="checkbox" id="mode-auto"> <span id="mode-text">每次询问</span>
      </label>
      <span id="head-links"></span>
    </div>
    <main id="scroller"><div id="log"></div></main>
    <footer id="footer">
      <div class="attachments" id="attachments" hidden></div>
      <form id="form">
        <textarea id="input" rows="1" placeholder="描述任务，Enter 发送，Shift+Enter 换行，可粘贴图片"></textarea>
        <button class="stop" id="stop" type="button" hidden title="中断模型请求和正在运行的命令（Esc）">停止</button>
        <button class="primary" id="send" type="submit">发送</button>
      </form>
    </footer>
  </section>
</div>
<dialog id="ws-dialog">
  <form method="dialog" id="ws-dialog-form">
    <h3 id="ws-dialog-title">新建工作区</h3>
    <p id="ws-dialog-desc"></p>
    <label>名字（目录名，留空自动生成）<input type="text" id="wsd-name" autocomplete="off"></label>
    <label class="radio"><input type="radio" name="wsd-mode" value="new" checked> 新建分支 <code id="wsd-branch-preview">agent/…</code></label>
    <label id="wsd-base-row">从哪里开始<input type="text" id="wsd-base" autocomplete="off"></label>
    <label class="radio" id="wsd-existing-radio"><input type="radio" name="wsd-mode" value="existing"> 使用已有分支（删除工作区时不会删除这条分支）</label>
    <label id="wsd-existing-row" hidden>分支<select id="wsd-existing"></select></label>
    <div class="hint" id="wsd-hint"></div>
    <div class="row">
      <button type="button" id="wsd-cancel">取消</button>
      <button type="submit" class="primary" id="wsd-ok">创建</button>
    </div>
  </form>
</dialog>
<dialog id="limits-dialog">
  <form method="dialog" id="limits-form">
    <h3>本会话的额度</h3>
    <p id="ld-spent"></p>
    <label>每轮最多步数（模型调用次数）
      <span class="pair"><select id="ld-steps-mode"><option value="default"></option><option value="none">不限</option><option value="custom">自定义</option></select>
      <input type="text" id="ld-steps" inputmode="numeric" hidden></span></label>
    <label>每轮最多花费（美元）
      <span class="pair"><select id="ld-cost-mode"><option value="default"></option><option value="none">不限</option><option value="custom">自定义</option></select>
      <input type="text" id="ld-cost" inputmode="decimal" hidden></span></label>
    <label>本会话累计最多花费（美元，留空不限）<input type="text" id="ld-budget" inputmode="decimal" autocomplete="off"></label>
    <div class="hint" id="ld-effective"></div>
    <div class="row">
      <button type="button" id="ld-cancel">取消</button>
      <button type="submit" class="primary">保存</button>
    </div>
  </form>
</dialog>
<dialog id="budget-dialog">
  <form method="dialog" id="budget-form">
    <h3 id="bd-title">额度</h3>
    <p id="bd-desc"></p>
    <label>累计最多花费（美元，留空不限）<input type="text" id="bd-value" inputmode="decimal" autocomplete="off"></label>
    <div class="hint" id="bd-hint"></div>
    <div class="row">
      <button type="button" id="bd-cancel">取消</button>
      <button type="submit" class="primary">保存</button>
    </div>
  </form>
</dialog>
<script src="/common.js"></script>
<script src="/markdown.js"></script>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const logBox = $("log"), input = $("input"), sendBtn = $("send");
let current = null;      // session id
let events = null;       // EventSource for current session
let busy = false;
let replaying = false;   // true while the server replays stored events after (re)connect
const toolCards = new Map();

// Cards still running or waiting when a turn ends (stopped, or interrupted by a restart) will never get a result.
function closeStaleCards() {
  for (const card of toolCards.values()) {
    if (card.classList.contains("ok") || card.classList.contains("error")) continue;
    card.classList.remove("waiting", "running");
    card._state.textContent = "未完成";
    card._approval?.remove();
  }
}

function append(node, parent = logBox) {
  const scroller = $("scroller");
  const atBottom = scroller.scrollHeight - scroller.scrollTop - scroller.clientHeight < 80;
  logBox.querySelector(".empty")?.remove();
  if (parent === logBox) foldTools();
  parent.append(node);
  if (atBottom) scroller.scrollTop = scroller.scrollHeight;
}

// While busy the input stays open: what you send is an interjection the agent sees at its next step.
function setBusy(value) {
  busy = value;
  $("dot").className = "dot " + (!current ? "none" : value ? "busy" : "idle");
  sendBtn.disabled = input.disabled = !current;
  $("root").classList.toggle("no-session", !current);
  sendBtn.textContent = value ? "插话" : "发送";
  $("stop").hidden = !value;
  if ($("fork")) $("fork").disabled = value; // the running turn isn't saved yet
  $("stop").disabled = false;
  input.placeholder = value
    ? "agent 正在工作：输入内容（可粘贴图片）会在它下一步之前送达（插话），Esc 停止"
    : "描述任务，Enter 发送，Shift+Enter 换行，可粘贴图片";
}

// Queued interjection bubbles, oldest first, waiting for delivery.
let queuedBubbles = [];
function settleQueued(count, label, className) {
  const settled = queuedBubbles.splice(0, count ?? queuedBubbles.length);
  for (const bubble of settled) {
    bubble.classList.remove("queued");
    if (className) bubble.classList.add(className);
    bubble._tag.textContent = label;
  }
}

async function stopTurn() {
  if (!busy || !current) return;
  $("stop").disabled = true;
  try { await api(`/api/sessions/${current}/stop`, {}); } catch (e) { alert(e.message); }
}
$("stop").onclick = stopTurn;
document.addEventListener("keydown", (ev) => { if (ev.key === "Escape") stopTurn(); });

// ---------- session list ----------
const collapsed = new Set(JSON.parse(localStorage.getItem("rca.collapsed") || '["__other__"]'));
let currentWorkspace = null;

// "22:59" today, "10/18" before that.
function shortTime(iso) {
  const d = new Date(iso), now = new Date();
  return d.toDateString() === now.toDateString()
    ? d.toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit", hour12: false })
    : `${d.getMonth() + 1}/${d.getDate()}`;
}

// Two lines per session; the full numbers are in the tooltip.
function sessionItem(s) {
  const item = el("a", "item" + (s.id === current ? " active" : ""));
  item.href = "#" + s.id;
  const title = el("div", "title");
  if (s.busy) title.append(el("span", "dot busy"));
  title.append(el("span", "name", s.title || "（未命名）"));
  if (s.forkedFrom) {
    const badge = el("span", "badge", "fork");
    badge.title = `fork 自 ${s.forkedFrom.id}（前 ${s.forkedFrom.turns} 轮）`;
    title.append(badge);
  }
  if (s.approvalMode === "auto") title.append(el("span", "badge", "自动"));
  const sub = el("div", "sub", `${shortTime(s.updatedAt)} · ${s.turns} 轮 · ${fmt.usd(s.totals.costUsd)}`);
  if (s.totals.contextTokens > CONTEXT_WARN_TOKENS) sub.append(" · ", el("span", "ctx-warn", `上下文 ${fmt.k(s.totals.contextTokens)}`));
  item.append(title, sub);
  item.addEventListener("contextmenu", (ev) => sessionMenu(ev, s));
  item.title = [s.title || "（未命名）",
    `${fmt.time(s.updatedAt)} · ${s.turns} 轮 · 上下文 ${fmt.k(s.totals.contextTokens)} · ${fmt.usd(s.totals.costUsd)} · ${s.totals.toolCalls} 次工具调用`,
    s.approvalMode === "auto" ? "自动批准 bash" : "bash 每次询问", s.workspace, s.id].join("\n");
  return item;
}

// ---------- context menu, clipboard ----------
function toast(text) {
  document.querySelector(".toast")?.remove();
  const box = el("div", "toast", text);
  document.body.append(box);
  setTimeout(() => box.remove(), 1600);
}

async function copyText(text, label) {
  try {
    await navigator.clipboard.writeText(text);
  } catch {
    // Clipboard API refused (no focus, old browser): fall back to a hidden textarea.
    const area = el("textarea");
    area.value = text;
    document.body.append(area);
    area.select();
    document.execCommand("copy");
    area.remove();
  }
  toast(`已复制${label}`);
}

function closeMenu() { document.querySelector(".menu")?.remove(); }
// items: [label, action] pairs, or null for a separator.
function showMenu(ev, items) {
  ev.preventDefault();
  closeMenu();
  const menu = el("div", "menu");
  for (const item of items) {
    if (!item) { menu.append(el("hr")); continue; }
    const btn = el("button", "", item[0]);
    btn.type = "button";
    btn.onclick = () => { closeMenu(); item[1](); };
    menu.append(btn);
  }
  document.body.append(menu);
  // Keep the menu inside the window.
  const { width, height } = menu.getBoundingClientRect();
  menu.style.left = Math.min(ev.clientX, innerWidth - width - 4) + "px";
  menu.style.top = Math.min(ev.clientY, innerHeight - height - 4) + "px";
}
document.addEventListener("click", closeMenu);
document.addEventListener("keydown", (ev) => { if (ev.key === "Escape") closeMenu(); });
window.addEventListener("blur", closeMenu);

// newWorkspace: { name } to fork into a new worktree that starts at the source workspace's current commit.
async function forkSession(id, newWorkspace) {
  const res = await api(`/api/sessions/${id}/fork`, newWorkspace ? { newWorkspace } : {});
  location.hash = res.meta.id;
  if (!newWorkspace) return toast("已 fork 为新会话（同一个工作区）");
  const notes = [`已 fork 到新工作区 ${res.workspace.name}（分支 ${res.workspace.branch}）`];
  if (res.uncommitted) notes.push(`原工作区有 ${res.uncommitted} 个未提交的改动，没有带过去`);
  toast(notes.join("；"));
}

function sessionMenu(ev, s) {
  const items = [
    ["复制 session id", () => copyText(s.id, " session id")],
    ["复制工作区路径", () => copyText(s.workspace, "工作区路径")],
    null,
    ["Fork（同一工作区）", () => forkSession(s.id).catch((e) => alert(e.message))],
  ];
  const project = projectOf(s.workspace);
  if (project?.repo) items.push(["Fork 到新工作区…", () => openWorkspaceDialog(project, { forkFrom: s })]);
  showMenu(ev, items);
}

// The project whose workspaces include this directory.
function projectOf(path) {
  return projects.find((p) => p.workspaces.some((w) => w.path === path)) ?? null;
}

function toggleGroup(key) {
  if (collapsed.has(key)) collapsed.delete(key); else collapsed.add(key);
  localStorage.setItem("rca.collapsed", JSON.stringify([...collapsed]));
  renderSidebar();
}

function smallButton(label, title, onclick, className = "") {
  const btn = el("button", className, label);
  btn.type = "button";
  btn.title = title;
  btn.onclick = (ev) => { ev.stopPropagation(); onclick(); };
  return btn;
}

// Level 1: a project (a repository, or any folder). Its workspaces are listed under it.
function projectGroup(p, sessions) {
  const frag = document.createDocumentFragment();
  const key = "p:" + p.path;
  const head = el("div", "ws-head" + (p.workspaces.some((w) => w.path === currentWorkspace) ? " current" : ""));
  head.title = p.repo ? `${p.path}\ngit 仓库：${p.repo}` : `${p.path}\n不是 git 仓库：只有主目录，不能新建工作区`;
  const count = sessions.filter((s) => p.workspaces.some((w) => w.path === s.workspace)).length;
  head.append(el("span", "caret", collapsed.has(key) ? "▸" : "▾"), el("span", "name", p.name), el("span", "count", String(count)));
  const spend = spendBadge(p.spentUsd, p.budgetUsd);
  if (spend) head.append(spend);
  head.onclick = () => toggleGroup(key);
  head.addEventListener("contextmenu", (ev) => showMenu(ev, [
    ["复制路径", () => copyText(p.path, "路径")],
    ["设置项目额度…", () => openBudgetDialog(p)],
  ]));
  if (p.repo) head.append(smallButton("+ 工作区", "新建一个 git worktree（独立的分支和目录）", () => openWorkspaceDialog(p)));
  head.append(smallButton("×", "从列表移除项目（不删除文件、工作区和会话）", async () => {
    if (!confirm(`从列表移除项目 ${p.path}？\n不会删除任何文件、worktree 或会话，它的会话会归到“其他”。`)) return;
    await api("/api/projects/remove", { path: p.path }).catch((e) => alert(e.message));
    refreshSessions();
  }, "x"));
  frag.append(head);
  if (!collapsed.has(key)) {
    for (const w of p.workspaces) frag.append(workspaceGroup(p, w, sessions.filter((s) => s.workspace === w.path)));
  }
  return frag;
}

// Level 2: a workspace with its branch and uncommitted file count, then its sessions.
function workspaceGroup(p, w, sessions) {
  const frag = document.createDocumentFragment();
  const key = "w:" + w.path;
  const head = el("div", "ws-head sub" + (w.path === currentWorkspace ? " current" : ""));
  head.title = [w.path, w.branch ? `分支 ${w.branch}` : "", w.managed ? "由这里创建" : w.main ? "项目主目录" : "手动创建的 worktree"].filter(Boolean).join("\n");
  head.append(el("span", "caret", collapsed.has(key) ? "▸" : "▾"), el("span", "name", w.name));
  if (w.branch) head.append(el("span", "branch", w.branch));
  if (w.missing) head.append(el("span", "gone", "目录不存在"));
  else if (w.dirty) head.append(el("span", "dirty", `${w.dirty} 改动`));
  const spend = spendBadge(w.spentUsd, w.budgetUsd);
  if (spend) head.append(spend);
  if (!w.missing) head.append(smallButton("+ 会话", `在 ${w.path} 新建会话`, () => createSession(w.path)));
  head.onclick = () => toggleGroup(key);
  head.addEventListener("contextmenu", (ev) => workspaceMenu(ev, p, w));
  frag.append(head);
  if (!collapsed.has(key)) {
    const box = el("div", "in-ws");
    if (sessions.length === 0 && !w.missing) box.append(el("div", "ws-empty", "还没有会话"));
    for (const s of sessions) box.append(sessionItem(s));
    frag.append(box);
  }
  return frag;
}

function workspaceMenu(ev, p, w) {
  const items = [["复制路径", () => copyText(w.path, "路径")]];
  if (w.branch) items.push(["复制分支名", () => copyText(w.branch, "分支名")]);
  if (!w.missing) items.push(["在文件管理器中打开", () => api("/api/projects/reveal", { path: w.path }).catch((e) => alert(e.message))]);
  items.push(["设置工作区额度…", () => openBudgetDialog(p, w)]);
  if (!w.main) items.push(null, ["删除工作区…", () => deleteWorkspace(p, w)]);
  showMenu(ev, items);
}

async function deleteWorkspace(p, w) {
  const branchNote = !w.branch ? "" : w.managed ? `\n分支 ${w.branch} 已合并时一起删除，有未合并的提交就保留。` : `\n分支 ${w.branch} 不会被删除。`;
  if (!confirm(`删除工作区 ${w.name}？\n会删除目录 ${w.root}${branchNote}\n这个工作区的会话记录会保留（归到“其他”）。`)) return;
  let res;
  try {
    res = await api("/api/projects/workspaces/remove", { project: p.path, root: w.root });
  } catch (e) {
    if (!e.message.startsWith("409") || !e.message.includes("未提交")) return alert(e.message);
    if (!confirm(`${e.message.replace(/^409 /, "")}。\n仍然删除？这些改动会丢失。`)) return;
    try { res = await api("/api/projects/workspaces/remove", { project: p.path, root: w.root, force: true }); } catch (e2) { return alert(e2.message); }
  }
  toast(res.note ?? (res.branchDeleted ? `已删除工作区和分支 ${res.branch}` : "已删除工作区"));
  refreshSessions();
}

let sessionList = [];
let projects = [];

async function refreshSessions() {
  try { [sessionList, projects] = await Promise.all([api("/api/sessions"), api("/api/projects")]); } catch (e) { return; }
  currentWorkspace = sessionList.find((s) => s.id === current)?.workspace ?? currentWorkspace;
  renderSidebar();
}

function renderSidebar() {
  const box = $("sessions");
  box.replaceChildren();
  if (projects.length === 0) box.append(el("div", "ws-empty", "点上方「选择…」或输入路径，打开第一个项目"));
  for (const p of projects) box.append(projectGroup(p, sessionList));
  const known = new Set(projects.flatMap((p) => p.workspaces.map((w) => w.path)));
  const others = sessionList.filter((s) => !known.has(s.workspace));
  if (others.length) {
    const key = "__other__";
    const head = el("div", "ws-head");
    head.title = "目录不在任何项目里的会话（项目被移除、或工作区已删除）";
    head.append(el("span", "caret", collapsed.has(key) ? "▸" : "▾"), el("span", "name", "其他"), el("span", "count", String(others.length)));
    head.onclick = () => toggleGroup(key);
    box.append(head);
    if (!collapsed.has(key)) for (const s of others) box.append(sessionItem(s));
  }
  $("ws-form").hidden = projects.length > 0 && !wsFormOpen;
  $("ws-add").hidden = projects.length === 0;
  if (!current) renderStart();
}

// ---------- spending caps ----------
// "$1.20 / $5": shown only when a cap is set; amber from 80%, red once used up.
function spendBadge(spent, cap) {
  if (typeof cap !== "number") return null;
  const ratio = cap === 0 ? 1 : spent / cap;
  const badge = el("span", "spend" + (ratio >= 1 ? " over" : ratio >= 0.8 ? " near" : ""), `$${spent.toFixed(2)} / $${cap}`);
  badge.title = `已花 $${spent.toFixed(4)}，上限 $${cap}${ratio >= 1 ? "：已用完，新消息会被拒绝" : ""}`;
  return badge;
}

// "" = no cap; otherwise a number >= 0. Throws a message for anything else.
function parseUsd(text, label) {
  const t = text.trim().replace(/^\$/, "");
  if (t === "") return null;
  const n = Number(t);
  if (!Number.isFinite(n) || n < 0) throw new Error(`${label}要填一个不小于 0 的数字，或留空`);
  return n;
}

let budgetTarget = null; // { project, workspace? }
function openBudgetDialog(project, workspace) {
  budgetTarget = { project, workspace };
  const scope = workspace ? `工作区 ${workspace.name}` : `项目 ${project.name}`;
  const cap = workspace ? workspace.budgetUsd : project.budgetUsd;
  const spent = workspace ? workspace.spentUsd : project.spentUsd;
  $("bd-title").textContent = `${scope}的额度`;
  $("bd-desc").textContent = `${workspace ? "这个工作区" : "这个项目所有工作区"}里全部会话的累计花费，目前 $${spent.toFixed(4)}。超过上限后，正在跑的一轮会停下来做总结，之后的新消息会被拒绝。`;
  $("bd-value").value = typeof cap === "number" ? String(cap) : "";
  $("bd-hint").textContent = "";
  $("budget-dialog").showModal();
}
$("bd-cancel").onclick = () => $("budget-dialog").close();
$("budget-form").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const { project, workspace } = budgetTarget;
  try {
    const budgetUsd = parseUsd($("bd-value").value, "上限");
    await api("/api/projects/budget", { project: project.path, budgetUsd, ...(workspace ? { workspace: workspace.path } : {}) });
    $("budget-dialog").close();
    refreshSessions();
  } catch (e) { $("bd-hint").textContent = e.message; $("bd-hint").className = "err-text"; }
});

let defaultLimits = null; // { maxSteps, maxTurnCostUsd } from .env
async function openLimitsDialog() {
  const [info, defaults, stats] = await Promise.all([
    api(`/api/sessions/${current}`),
    defaultLimits ?? api("/api/projects/limits"),
    api(`/api/sessions/${current}/stats`),
  ]);
  defaultLimits = defaults;
  const limits = info.limits ?? {};
  const pick = (mode, input, value, defaultLabel) => {
    mode.options[0].textContent = `默认（${defaultLabel}）`;
    mode.value = value === undefined ? "default" : value === null ? "none" : "custom";
    input.value = typeof value === "number" ? String(value) : "";
    input.hidden = mode.value !== "custom";
  };
  pick($("ld-steps-mode"), $("ld-steps"), limits.maxSteps, `${defaults.maxSteps} 步`);
  pick($("ld-cost-mode"), $("ld-cost"), limits.maxTurnCostUsd, defaults.maxTurnCostUsd === null ? "不限" : `$${defaults.maxTurnCostUsd}`);
  $("ld-budget").value = typeof info.budgetUsd === "number" ? String(info.budgetUsd) : "";
  $("ld-spent").textContent = `本会话已花 $${stats.totals.costUsd.toFixed(4)}（${stats.totals.turns} 轮）。修改从下一轮开始生效。项目和工作区的额度在侧栏右键设置。`;
  $("ld-effective").className = "hint";
  $("ld-effective").textContent = info.budget ? `当前最紧的累计额度：${info.budget.label.trim()}，还剩 $${Math.max(0, info.budget.remainingUsd).toFixed(4)}` : "没有累计额度限制。";
  $("limits-dialog").showModal();
}
for (const [mode, input] of [["ld-steps-mode", "ld-steps"], ["ld-cost-mode", "ld-cost"]]) {
  $(mode).addEventListener("change", () => { $(input).hidden = $(mode).value !== "custom"; if (!$(input).hidden) $(input).focus(); });
}
$("ld-cancel").onclick = () => $("limits-dialog").close();
$("limits-form").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  try {
    const limits = {};
    const steps = $("ld-steps-mode").value, cost = $("ld-cost-mode").value;
    if (steps === "none") limits.maxSteps = null;
    if (steps === "custom") {
      const n = Number($("ld-steps").value.trim());
      if (!Number.isInteger(n) || n < 1) throw new Error("步数要填一个正整数");
      limits.maxSteps = n;
    }
    if (cost === "none") limits.maxTurnCostUsd = null;
    if (cost === "custom") {
      const n = parseUsd($("ld-cost").value, "每轮花费");
      if (n === null) throw new Error("每轮花费要填一个数字，不限请选“不限”");
      limits.maxTurnCostUsd = n;
    }
    await api(`/api/sessions/${current}/settings`, { limits, budgetUsd: parseUsd($("ld-budget").value, "累计花费") });
    $("limits-dialog").close();
    toast("额度已保存，从下一轮开始生效");
  } catch (e) { $("ld-effective").textContent = e.message; $("ld-effective").className = "err-text"; }
});

// ---------- new workspace / fork into a new workspace ----------
let dialogState = null; // { project, forkFrom? }

function branchPreview() {
  const name = $("wsd-name").value.trim().replace(/\s+/g, "-").replace(/[^\w.-]/g, "");
  $("wsd-branch-preview").textContent = `agent/${name || "<自动生成>"}`;
}

function syncDialogMode() {
  const existing = document.querySelector('input[name="wsd-mode"]:checked').value === "existing";
  $("wsd-existing-row").hidden = !existing;
  $("wsd-base-row").hidden = existing || Boolean(dialogState?.forkFrom);
}

async function openWorkspaceDialog(project, { forkFrom } = {}) {
  dialogState = { project, forkFrom };
  const fork = Boolean(forkFrom);
  $("ws-dialog-title").textContent = fork ? "Fork 到新工作区" : "新建工作区";
  // Same rule as the server: <main checkout>.worktrees/<name>, next to the repository.
  const main = project.workspaces.find((w) => w.main)?.root ?? project.repo;
  $("ws-dialog-desc").textContent = fork
    ? `复制会话「${forkFrom.title || forkFrom.id}」的历史，在一个新的 git worktree 里继续。新分支从原工作区当前的提交开始（未提交的改动不会带过去）。`
    : `新建一个 git worktree，放在 ${main}.worktrees 下。仓库根目录的 .worktreeinclude 里列出的文件（如 .env）会被复制过去。`;
  $("wsd-name").value = "";
  document.querySelector('input[name="wsd-mode"][value="new"]').checked = true;
  $("wsd-existing-radio").hidden = fork;
  $("wsd-base").value = "";
  $("wsd-hint").textContent = "";
  $("wsd-ok").textContent = fork ? "Fork" : "创建并新建会话";
  branchPreview();
  syncDialogMode();
  $("ws-dialog").showModal();
  if (fork) return;
  try {
    const { branches, base } = await api(`/api/projects/branches?project=${encodeURIComponent(project.path)}`);
    $("wsd-base").placeholder = base;
    $("wsd-existing").replaceChildren(...branches.map((b) => { const o = el("option", "", b); o.value = b; return o; }));
    if (branches.length === 0) $("wsd-existing-radio").hidden = true;
  } catch (e) { $("wsd-hint").textContent = e.message; }
}

$("wsd-name").addEventListener("input", branchPreview);
document.querySelectorAll('input[name="wsd-mode"]').forEach((r) => r.addEventListener("change", syncDialogMode));
$("wsd-cancel").onclick = () => $("ws-dialog").close();
$("ws-dialog-form").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const { project, forkFrom } = dialogState;
  const name = $("wsd-name").value.trim();
  const ok = $("wsd-ok");
  ok.disabled = true;
  $("wsd-hint").textContent = forkFrom ? "正在创建 worktree…" : "正在创建 worktree（git worktree add）…";
  try {
    if (forkFrom) {
      await forkSession(forkFrom.id, { name });
    } else {
      const existing = document.querySelector('input[name="wsd-mode"]:checked').value === "existing";
      const body = { project: project.path, name, ...(existing ? { branch: $("wsd-existing").value } : { base: $("wsd-base").value.trim() }) };
      const res = await api("/api/projects/workspaces", body);
      collapsed.delete("p:" + project.path);
      if (res.copied.length) toast(`已复制 ${res.copied.join("、")}`);
      if (res.workspace.missing) toast(`分支 ${res.workspace.branch} 里没有 ${project.subdir}，没法在这里新建会话`);
      else await createSession(res.workspace.path);
    }
    $("ws-dialog").close();
    refreshSessions();
  } catch (e) {
    $("wsd-hint").textContent = e.message;
  } finally {
    ok.disabled = false;
  }
});

let wsFormOpen = false;
$("ws-add").onclick = () => {
  wsFormOpen = !wsFormOpen;
  $("ws-form").hidden = !wsFormOpen;
  if (wsFormOpen) $("ws-path").focus();
};

// What the chat pane shows when no session is open.
function renderStart() {
  const box = el("div", "start");
  box.append(el("h2", "", "在哪个目录工作？"),
    el("p", "", projects.length ? "选一个工作区新建会话，或从左侧继续之前的会话。" : "先在左上角打开一个项目，agent 会在那个目录里读写文件、运行命令。"));
  for (const p of projects) {
    for (const w of p.workspaces.filter((x) => !x.missing)) {
      const btn = el("button");
      btn.type = "button";
      btn.append(el("span", "name", w.main ? p.name : `${p.name} / ${w.name}`), el("span", "path", [w.branch, w.path].filter(Boolean).join(" · ")));
      btn.onclick = () => createSession(w.path);
      box.append(btn);
    }
  }
  const keys = el("div", "keys");
  keys.innerHTML = "<kbd>Enter</kbd> 发送　<kbd>Shift</kbd>+<kbd>Enter</kbd> 换行　<kbd>Esc</kbd> 停止 agent";
  box.append(keys);
  logBox.replaceChildren(box);
}

async function createSession(workspace) {
  try {
    const approvalMode = $("new-auto").checked ? "auto" : "ask";
    const meta = await api("/api/sessions", { workspace, approvalMode });
    collapsed.delete("w:" + meta.workspace);
    location.hash = meta.id;
  } catch (e) { alert(e.message); }
}

// One button: opens the typed path, or shows the OS folder chooser when the field is empty.
async function openWorkspace() {
  const path = $("ws-path").value.trim();
  if (!path) return pickWorkspace();
  try {
    const p = await api("/api/projects", { path });
    $("ws-path").value = "";
    $("ws-open").textContent = "选择…";
    collapsed.delete("p:" + p.path);
    refreshSessions();
  } catch (e) { alert(e.message); }
}
$("ws-open").onclick = openWorkspace;
$("ws-path").addEventListener("input", () => { $("ws-open").textContent = $("ws-path").value.trim() ? "打开" : "选择…"; });

// The server shows the OS folder chooser (a web page can't read absolute paths itself).
async function pickWorkspace() {
  const button = $("ws-open");
  button.disabled = true;
  button.textContent = "等待选择…";
  try {
    const p = await api("/api/projects/pick", {});
    if (p.cancelled) return;
    collapsed.delete("p:" + p.path);
    refreshSessions();
  } catch (e) {
    alert(e.message);
  } finally {
    button.disabled = false;
    button.textContent = "选择…";
  }
}
$("ws-path").addEventListener("keydown", (ev) => { if (ev.key === "Enter") openWorkspace(); });

// ---------- transcript rendering ----------
function renderAssistant(text) {
  const box = el("div", "msg assistant md");
  box.append(renderMarkdown(text));
  return box;
}

// Models often prefix every command with "cd <workspace> &&", which is where bash already runs.
function stripCd(command) {
  if (!currentWorkspace) return command;
  const ws = currentWorkspace.replace(/\\/g, "/").replace(/\/$/, "");
  const forms = [currentWorkspace, ws, ws.replace(/^([a-z]):/i, (_, d) => "/" + d.toLowerCase()), ws.replace(/^([a-z]):/i, (_, d) => "/mnt/" + d.toLowerCase())];
  const quoted = forms.map((f) => f.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|");
  return command.replace(new RegExp(`^cd\\s+["']?(${quoted})/?["']?\\s*(&&|;)\\s*`, "i"), "");
}

function describe(call) {
  const a = call.input || {};
  if (typeof a.command === "string") return `${call.name}: ${stripCd(a.command)}`;
  if (typeof a.path === "string") return `${call.name} ${a.path}`;
  if (typeof a.query === "string") return `${call.name}: ${a.query}`;
  return `${call.name} ${JSON.stringify(a)}`;
}

// A bash call is shown as the command itself; anything else as JSON.
function inputText(input) {
  const keys = Object.keys(input || {});
  if (keys.length === 1 && typeof input.command === "string") return input.command;
  return JSON.stringify(input, null, 2);
}

// Consecutive tool calls share one timeline. Once something else follows, a run of FOLD_AT or more folds
// into a single "N 次工具调用" line, unless one of them still needs attention.
const FOLD_AT = 3;
function toolGroup() {
  const last = logBox.lastElementChild;
  if (last?.classList.contains("tools")) return last;
  const group = el("details", "tools");
  group.open = true;
  group._summary = el("summary");
  group._list = el("div", "list");
  group.append(group._summary, group._list);
  append(group);
  return group;
}

function updateGroup(group) {
  const cards = group._list.children.length;
  const fails = group._list.querySelectorAll(".tool.error").length;
  group._summary.hidden = cards < FOLD_AT;
  group._summary.replaceChildren(`${cards} 次工具调用`);
  if (fails) group._summary.append(" · ", el("span", "fails", `${fails} 次失败`));
}

function foldTools() {
  const group = logBox.lastElementChild;
  if (!group?.classList.contains("tools") || group._list.children.length < FOLD_AT) return;
  if (group._list.querySelector(".tool.waiting, .tool.running")) return;
  group.open = false;
}

// Only a hint for the approval card, not a safety check: flags commands that delete, overwrite or force things.
const DANGEROUS = /\brm\s+-\w*[rf]|\brmdir\b|\bdel\s|Remove-Item|\bgit\s+(push\b.*(-f\b|--force)|reset\s+--hard|clean\s+-\w*f|checkout\s+--?\s)|\bsudo\b|\bmkfs|\bdd\s+if=|\bchmod\s+-R|\bchown\s+-R|>\s*\/dev\/sd/i;

const handlers = {
  user(e) {
    const bubble = el("div", "msg user" + (e.queued ? " queued" : ""));
    if (e.images?.length) {
      const imgs = el("div", "imgs");
      for (const name of e.images) {
        const src = withToken(`/api/sessions/${current}/attachment`, { name });
        const img = el("img");
        img.src = src;
        img.alt = name;
        img.onclick = () => window.open(src, "_blank");
        imgs.append(img);
      }
      bubble.append(imgs);
    }
    if (e.text) bubble.append(e.text);
    if (e.queued) {
      bubble._tag = el("span", "tag", "插话 · 等待送达");
      bubble.append(bubble._tag);
      queuedBubbles.push(bubble);
    }
    append(bubble);
    setBusy(true);
  },
  interjection_delivered(e) {
    settleQueued(e.count, "插话 · 已送达");
    append(el("div", "note", `agent 已收到 ${e.count} 条插话`));
  },
  output_truncated(e) { append(el("div", "note", `输出超过 max_tokens，工具调用被截断：已让 agent 拆小重试（第 ${e.retry} 次）`)); },
  interjection_dropped(e) { settleQueued(e.count, "插话 · 未送达（已停止）", "dropped"); },
  assistant_text(e) { append(renderAssistant(e.text)); },
  tool_call(e) {
    const card = el("details", "tool running");
    const summary = el("summary");
    card._state = el("span", "state", "运行中…");
    summary.append(el("span", "label", describe(e.call)), card._state);
    card._body = el("div", "body");
    // A short one-line command is already readable in the summary.
    const cmd = e.call.input?.command;
    card._input = el("pre", "input", inputText(e.call.input));
    if (!(typeof cmd === "string" && Object.keys(e.call.input).length === 1 && !cmd.includes("\n") && cmd.length <= 100)) card._body.append(card._input);
    card.append(summary, card._body);
    toolCards.set(e.call.id, card);
    const group = toolGroup();
    append(card, group._list);
    updateGroup(group);
  },
  approval_request(e) {
    const card = toolCards.get(e.call.id);
    if (!card) return;
    card.classList.add("waiting");
    const danger = DANGEROUS.test(e.call.input?.command ?? "");
    card.classList.toggle("danger", danger);
    if (!card._input.isConnected) card._body.prepend(card._input);
    card.closest(".tools").open = true;
    card.open = true;
    card._state.textContent = "等待批准";
    const bar = el("div", "approval");
    const allow = el("button", "primary", "允许"), deny = el("button", "", "拒绝");
    const always = el("button", "link", "本会话不再询问");
    always.title = "允许这次调用，并把本会话切换为自动批准";
    allow.type = deny.type = always.type = "button";
    const session = current;
    const disable = () => { allow.disabled = deny.disabled = always.disabled = true; };
    const answer = (value) => {
      disable();
      api(`/api/sessions/${session}/approve`, { id: e.id, allow: value }).catch((err) => alert(err.message));
    };
    allow.onclick = () => answer(true);
    deny.onclick = () => answer(false);
    // Switching the session to auto also approves this pending call (server side).
    always.onclick = () => { disable(); setApprovalMode("auto"); };
    bar.append(el("span", "", danger ? "可能删除或覆盖文件，确认后再允许" : "这个调用需要你的批准"), always, deny, allow);
    card._body.append(bar);
    card._approval = bar;
    card._approvalId = e.id;
    if (!replaying) card.scrollIntoView({ block: "nearest" });
  },
  approval_resolved(e) {
    for (const card of toolCards.values()) {
      if (card._approvalId !== e.id) continue;
      card.classList.remove("waiting");
      card._approval.remove();
      card._approval = null;
      card._state.textContent = e.allow ? "已允许，运行中…" : "已拒绝";
      card.open = false;
    }
  },
  forked(e) {
    const note = el("div", "note", `↳ 从「${e.fromTitle || e.from}」fork 而来（包含它的前 ${e.turns} 轮），之后的对话只属于这个会话 · `);
    note.append(link("#" + e.from, "打开原会话"));
    append(note);
  },
  approval_mode(e) {
    showMode(e.mode);
    append(el("div", "note", e.mode === "auto" ? "权限已切换为：自动批准（之后的 bash 不再询问）" : "权限已切换为：每次询问"));
  },
  tool_result(e) {
    const card = toolCards.get(e.call.id);
    if (!card) return;
    card.classList.remove("waiting", "running");
    card.classList.add(e.result.isError ? "error" : "ok");
    // Success is the normal case and stays quiet; only failures say so.
    card._state.textContent = e.result.isError ? "失败" : "";
    card._body.append(el("pre", "", e.result.content));
    updateGroup(card.closest(".tools"));
  },
  turn_end(e) {
    const ok = e.finishReason === "end_turn";
    const label = { interrupted: "已停止", max_steps: "达到步数上限", max_cost: "达到单轮成本上限", budget: "累计额度用完", repeated: "重复调用同一工具，已停止" }[e.finishReason] || (ok ? "完成" : "停止：" + e.finishReason);
    append(el("div", "end" + (ok ? "" : " bad"), `${label} · ${e.steps} 步`));
    endTurn(e.continues);
  },
  error(e) {
    append(el("div", "err", "错误：" + e.message));
    endTurn(e.continues);
  },
};

// A turn ended; if queued interjections arrived too late, they run as the next turn.
function endTurn(continues) {
  closeStaleCards();
  foldTools();
  if (continues) {
    settleQueued(undefined, "插话 · 作为下一轮发送");
    append(el("div", "note", "继续处理插话内容…"));
  } else {
    settleQueued(undefined, "插话 · 未送达", "dropped");
    setBusy(false);
  }
  if (!replaying) refreshSessions();
}

// ---------- session permission ----------
function showMode(mode) {
  const box = $("mode");
  box.hidden = false;
  box.classList.toggle("auto", mode === "auto");
  $("mode-auto").checked = mode === "auto";
  $("mode-text").textContent = mode === "auto" ? "自动批准" : "每次询问";
}

async function setApprovalMode(mode) {
  try {
    await api(`/api/sessions/${current}/settings`, { approvalMode: mode });
    refreshSessions();
  } catch (e) {
    alert(e.message);
  }
}

$("mode-auto").addEventListener("change", (ev) => {
  const auto = ev.target.checked;
  if (auto && !confirm("开启后，本会话里 agent 的 bash 命令将直接执行，不再询问。确定吗？")) {
    ev.target.checked = false;
    return;
  }
  // The checkbox snaps back until the server confirms via the approval_mode event.
  ev.target.checked = !auto;
  setApprovalMode(auto ? "auto" : "ask");
});

// ---------- open a session ----------
function openSession(id) {
  events?.close();
  attachments = [];
  renderAttachments();
  queuedBubbles = [];
  current = id || null;
  toolCards.clear();
  $("head-links").replaceChildren();
  $("mode").hidden = true;
  $("nav-stats").href = withToken("/stats") + (current ? "#" + current : "");
  if (!current) {
    logBox.replaceChildren();
    $("head-title").textContent = "";
    $("meta").textContent = "";
    setBusy(false);
    refreshSessions();
    return;
  }
  const source = events = new EventSource(withToken(`/events/${current}`));
  // The server replays the whole transcript on every (re)connect, so start from a clean slate.
  events.addEventListener("hello", (msg) => {
    const info = JSON.parse(msg.data);
    toolCards.clear();
    queuedBubbles = [];
    logBox.replaceChildren(el("div", "empty", "给 agent 一个任务开始吧。"));
    $("head-title").textContent = info.title || "（未命名）";
    $("meta").textContent = `${info.model} · ${info.workspace}`;
    currentWorkspace = info.workspace;
    const links = $("head-links");
    const fork = el("button", "", "Fork");
    fork.type = "button";
    fork.id = "fork";
    fork.title = "复制这个会话的历史，在新会话里继续（原会话不受影响）";
    fork.onclick = (ev) => {
      ev.stopPropagation();
      const r = fork.getBoundingClientRect();
      sessionMenu({ preventDefault() {}, clientX: r.left, clientY: r.bottom + 4 }, { ...info, workspace: currentWorkspace });
    };
    const limitsBtn = el("button", "", "额度");
    limitsBtn.type = "button";
    limitsBtn.title = "本会话的每轮步数、每轮花费和累计花费上限";
    limitsBtn.onclick = () => openLimitsDialog().catch((e) => alert(e.message));
    links.replaceChildren(fork, limitsBtn, link(withToken("/stats") + "#" + current, "本会话统计"), document.createTextNode("·"),
      link(rawUrl(current, "events.jsonl"), "原始事件", true));
    showMode(info.approvalMode);
    setBusy(info.busy);
    replaying = true;
  });
  events.addEventListener("replay_done", () => {
    replaying = false;
    setBusy(busy);
  });
  events.onmessage = (msg) => {
    const event = JSON.parse(msg.data);
    handlers[event.type]?.(event);
  };
  // EventSource reconnects on its own after a network blip, but gives up (CLOSED) when the server refuses the
  // session, e.g. because another process has it open. Fetch the same URL once to show why.
  events.onerror = async () => {
    $("dot").className = "dot";
    if (source.readyState !== EventSource.CLOSED) return;
    const res = await fetch(withToken(`/events/${id}`)).catch(() => null);
    const data = await res?.json().catch(() => ({}));
    if (current !== id) return;
    logBox.replaceChildren(el("div", "err", "无法打开这个会话：" + (data?.error || "连接失败，请确认服务仍在运行")));
    $("head-title").textContent = id;
    $("meta").textContent = "";
    input.disabled = sendBtn.disabled = true;
  };
  refreshSessions();
}

// ---------- image attachments ----------
const MAX_IMAGES = 8, MAX_IMAGE_BYTES = 5 * 1024 * 1024;
const IMAGE_TYPES = ["image/png", "image/jpeg", "image/gif", "image/webp"];
let attachments = []; // data URLs, in the order they were added

function renderAttachments() {
  const tray = $("attachments");
  tray.hidden = attachments.length === 0;
  tray.replaceChildren(...attachments.map((url, i) => {
    const box = el("div", "attachment");
    const img = el("img");
    img.src = url;
    const remove = el("button", "", "×");
    remove.type = "button";
    remove.title = "移除";
    remove.onclick = () => { attachments.splice(i, 1); renderAttachments(); };
    box.append(img, remove);
    return box;
  }));
}

function addImages(files) {
  for (const file of files) {
    if (!IMAGE_TYPES.includes(file.type)) { toast(`不支持的图片格式：${file.type || file.name}`); continue; }
    if (file.size > MAX_IMAGE_BYTES) { toast(`图片超过 ${MAX_IMAGE_BYTES / 1024 / 1024} MB：${file.name}`); continue; }
    if (attachments.length >= MAX_IMAGES) { toast(`一条消息最多 ${MAX_IMAGES} 张图片`); break; }
    const reader = new FileReader();
    const slot = attachments.push("") - 1; // keep paste order even though reads finish in any order
    reader.onload = () => { attachments[slot] = reader.result; renderAttachments(); };
    reader.onerror = () => { attachments.splice(slot, 1); renderAttachments(); };
    reader.readAsDataURL(file);
  }
}

input.addEventListener("paste", (ev) => {
  const files = [...(ev.clipboardData?.files ?? [])].filter((f) => f.type.startsWith("image/"));
  if (files.length === 0) return; // plain text paste
  ev.preventDefault();
  addImages(files);
});
const footer = $("footer");
footer.addEventListener("dragover", (ev) => {
  if (![...ev.dataTransfer.types].includes("Files")) return;
  ev.preventDefault();
  footer.classList.add("dragging");
});
footer.addEventListener("dragleave", () => footer.classList.remove("dragging"));
footer.addEventListener("drop", (ev) => {
  footer.classList.remove("dragging");
  if (!ev.dataTransfer.files.length) return;
  ev.preventDefault();
  addImages([...ev.dataTransfer.files]);
});

$("form").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const text = input.value.trim();
  const images = attachments.filter(Boolean);
  if ((!text && images.length === 0) || !current) return;
  try {
    await api(`/api/sessions/${current}/message`, { text, ...(images.length ? { images } : {}) });
    input.value = "";
    input.style.height = "";
    attachments = [];
    renderAttachments();
    refreshSessions();
  } catch (e) { append(el("div", "err", "发送失败：" + e.message)); }
});
input.addEventListener("keydown", (ev) => {
  if (ev.key === "Enter" && !ev.shiftKey && !ev.isComposing) { ev.preventDefault(); $("form").requestSubmit(); }
});
input.addEventListener("input", () => { input.style.height = ""; input.style.height = input.scrollHeight + "px"; });

if (requireToken($("root"))) {
  window.addEventListener("hashchange", () => openSession(location.hash.slice(1)));
  openSession(location.hash.slice(1));
}
</script>
