<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>迭代记录 · raw-coding-agent</title>
<link rel="stylesheet" href="/common.css">
<script src="/theme.js"></script>
<style>
  body { height: 100vh; display: flex; flex-direction: column; }
  .layout { flex: 1; display: flex; min-height: 0; }
  main { flex: 1; overflow-y: auto; padding: 20px 24px 40px; }
  .wrap { max-width: 960px; margin: 0 auto; }
  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 18px; }
  .seg { display: inline-flex; border: 1px solid var(--line); overflow: hidden; }
  .seg button { border: 0; border-radius: 0; padding: 3px 12px; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button.on { background: var(--sel); color: var(--ink); }
  .seg button:not(.on) { color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 4px 6px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 0 8px; border-color: transparent; color: var(--muted); }
  .chip.on { border-color: var(--line); background: var(--sel); color: var(--ink); }
  .chip .n { color: var(--muted); font-variant-numeric: tabular-nums; }
  h2 { font-size: 12px; font-weight: 400; color: var(--muted); margin: 26px 0 8px; display: flex; align-items: center; gap: 8px; }
  h2:first-child { margin-top: 0; }
  h2 .n { font-weight: 400; }
  .tinted { --tint: light-dark(hsl(var(--hue) 55% 40%), hsl(var(--hue) 60% 62%)); }
  .swatch { width: 8px; height: 8px; flex: none; background: var(--tint); }
  .entry { border-left: 2px solid var(--tint, var(--line)); padding: 2px 0 2px 14px; margin: 0 0 18px; }
  .entry .head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .entry h3 { font-size: 13px; margin: 0; }
  .entry .mod { font-size: 12px; color: var(--tint, var(--muted)); }
  .entry .when { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; margin-left: auto; }
  .entry dl { margin: 4px 0 0; display: grid; grid-template-columns: 5ch 1fr; gap: 2px 8px; font-size: 13px; line-height: 1.65; }
  .entry dt { color: var(--muted); }
  .entry dd { margin: 0; }
  .commits { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 6px; }
  .commit { font: 12px var(--mono); padding: 0; border: 0; background: none; color: var(--muted); text-decoration: underline dotted var(--line); text-underline-offset: 3px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .commit.active { color: var(--ink); text-decoration-color: var(--ink); }
  .commit.missing { color: var(--err); border-style: dashed; cursor: default; }
  .pending { font-size: 12px; color: var(--warn); }
  .unfiled { font-size: 13px; }
  .unfiled .commit { margin: 0 6px 6px 0; }
  /* Commit detail: git show of the selected commit. */
  aside { width: 46%; max-width: 760px; flex: none; border-left: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-width: 0; }
  aside[hidden] { display: none; }
  aside .top { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); font-size: 13px; }
  aside .top b { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  aside .top .sha { font: 12px var(--mono); color: var(--muted); white-space: nowrap; flex: none; }
  aside .top a, aside .top button { flex: none; white-space: nowrap; }
  .topbar nav a.here { color: var(--ink); font-weight: 600; }
  aside pre { margin: 0; flex: 1; overflow: auto; padding: 12px 14px; font: 12px/1.55 var(--mono); white-space: pre; }
  .d-add { color: var(--ok); }
  .d-del { color: var(--err); }
  .d-hunk { color: var(--llm); }
  .d-file { font-weight: 600; }
</style>
</head>
<body>
<div class="topbar">
  <h1>raw-coding-agent</h1>
  <nav><a data-page="/" href="#">对话</a><a data-page="/stats" href="#">统计</a><a class="here">迭代记录</a></nav>
</div>
<div class="layout" id="root">
  <main><div class="wrap">
    <div class="bar">
      <span class="seg"><button type="button" id="by-time" class="on">时间线</button><button type="button" id="by-module">按模块</button></span>
      <span class="seg"><button type="button" id="newest" class="on" title="最新的在前">新 → 旧</button><button type="button" id="oldest">旧 → 新</button></span>
    </div>
    <div class="chips" id="chips"></div>
    <div id="list" style="margin-top:18px"></div>
  </div></main>
  <aside id="detail" hidden>
    <div class="top"><b id="d-title"></b><span class="sha" id="d-sha"></span><a id="d-web" target="_blank" hidden>在 GitHub 打开</a><button type="button" class="small" id="d-close">关闭</button></div>
    <pre id="d-body"></pre>
  </aside>
</div>
<script src="/common.js"></script>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
// One hue per module; .tinted turns it into a colour that reads on both themes.
const HUES = [215, 160, 35, 280, 0, 190, 100, 320, 55, 245];
let data = null;
let view = "time", newestFirst = true, onlyModule = null, openSha = null;

const dayOf = (iso) => (iso ? new Date(iso).toLocaleDateString("zh-CN", { year: "numeric", month: "long", day: "numeric" }) : "未提交");
const timeOf = (iso) => (iso ? new Date(iso).toLocaleString("zh-CN", { month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", hour12: false }) : "");

function tint(node, mod) {
  node.classList.add("tinted");
  node.style.setProperty("--hue", HUES[Object.keys(data.modules).indexOf(mod) % HUES.length]);
  return node;
}
const swatch = (mod) => tint(el("span", "swatch"), mod);

function commitButton(c) {
  if (c.missing) {
    const b = el("span", "commit missing", c.sha);
    b.title = "找不到这个提交（还没推送，或提交号写错了）";
    return b;
  }
  const b = el("button", "commit" + (c.sha === openSha ? " active" : ""), `${c.short} ${c.subject}`);
  b.type = "button";
  b.title = `${c.sha}\n${timeOf(c.date)}`;
  b.onclick = () => { location.hash = c.short; };
  return b;
}

function entryCard(e) {
  const card = tint(el("div", "entry"), e.module);
  const head = el("div", "head");
  const mod = el("span", "mod");
  mod.append(`[${data.modules[e.module] ?? e.module}]`);
  head.append(el("h3", "", e.title));
  if (view === "time") head.append(mod);
  head.append(el("span", "when", e.date ? timeOf(e.date) : ""));
  const dl = el("dl");
  dl.append(el("dt", "", "问题"), el("dd", "", e.problem), el("dt", "", "改动"), el("dd", "", e.change));
  const commits = el("div", "commits");
  if (e.commits.length === 0) commits.append(el("span", "pending", "还没有关联提交"));
  for (const c of e.commits) commits.append(commitButton(c));
  card.append(head, dl, commits);
  return card;
}

function sorted(entries) {
  // Uncommitted entries count as newest; ties keep file order.
  const key = (e) => e.date ?? "9999";
  const list = entries.map((e, i) => ({ e, i })).sort((a, b) => key(a.e).localeCompare(key(b.e)) || a.i - b.i).map((x) => x.e);
  return newestFirst ? list.reverse() : list;
}

function render() {
  const entries = data.entries.filter((e) => !onlyModule || e.module === onlyModule);
  // Module filter chips with counts.
  const chips = $("chips");
  chips.replaceChildren();
  const all = el("button", "chip" + (onlyModule ? "" : " on"));
  all.type = "button";
  all.append("全部", el("span", "n", data.entries.length));
  all.onclick = () => { onlyModule = null; render(); };
  chips.append(all);
  for (const [key, label] of Object.entries(data.modules)) {
    const n = data.entries.filter((e) => e.module === key).length;
    if (!n) continue;
    const chip = el("button", "chip" + (onlyModule === key ? " on" : ""));
    chip.type = "button";
    chip.append(swatch(key), label, el("span", "n", n));
    chip.onclick = () => { onlyModule = onlyModule === key ? null : key; render(); };
    chips.append(chip);
  }

  const list = $("list");
  list.replaceChildren();
  const groups = new Map();
  for (const e of sorted(entries)) {
    const key = view === "time" ? dayOf(e.date) : e.module;
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(e);
  }
  const order = view === "time" ? [...groups.keys()] : Object.keys(data.modules).filter((k) => groups.has(k));
  for (const key of order) {
    const h = el("h2");
    if (view === "module") h.append(swatch(key));
    h.append(view === "time" ? key : data.modules[key] ?? key, el("span", "n", `· ${groups.get(key).length} 项`));
    list.append(h);
    for (const e of groups.get(key)) list.append(entryCard(e));
  }
  if (entries.length === 0) list.append(el("div", "muted", "这个模块还没有记录。"));
  if (data.unfiled.length && !onlyModule) {
    list.append(el("h2", "", "未归档的提交"));
    const box = el("div", "unfiled");
    box.append(el("p", "muted", "这些提交还没有出现在任何迭代记录里（docs/iterations.json）。"));
    for (const c of data.unfiled) box.append(commitButton(c));
    list.append(box);
  }
}

async function showCommit(ref) {
  openSha = null;
  if (!ref) { $("detail").hidden = true; render(); return; }
  const commit = [...data.entries.flatMap((e) => e.commits), ...data.unfiled].find((c) => !c.missing && c.sha.startsWith(ref));
  $("detail").hidden = false;
  $("d-title").textContent = commit?.subject ?? ref;
  $("d-sha").textContent = commit?.short ?? "";
  $("d-sha").title = commit?.sha ?? "";
  $("d-body").replaceChildren("加载中…");
  const web = $("d-web");
  web.hidden = !data.repoUrl || !commit;
  if (commit && data.repoUrl) web.href = `${data.repoUrl}/commit/${commit.sha}`;
  if (commit) openSha = commit.sha;
  render();
  try {
    const d = await api(`/api/iterations/commit?sha=${encodeURIComponent(ref)}`);
    const pre = $("d-body");
    pre.replaceChildren();
    // Color the patch without innerHTML: one span per line.
    for (const line of d.text.split("\n")) {
      const cls = line.startsWith("+++") || line.startsWith("---") || line.startsWith("diff --git") ? "d-file"
        : line.startsWith("+") ? "d-add" : line.startsWith("-") ? "d-del" : line.startsWith("@@") ? "d-hunk" : "";
      pre.append(el("span", cls, line + "\n"));
    }
    if (d.truncated) pre.append(el("span", "muted", "\n…（太长，只显示前一部分；完整内容见 GitHub 或 git show）"));
    pre.scrollTop = 0;
  } catch (e) {
    $("d-body").replaceChildren(el("span", "err-text", e.message));
  }
}

function setSeg(onId, offId) { $(onId).classList.add("on"); $(offId).classList.remove("on"); }
$("by-time").onclick = () => { view = "time"; setSeg("by-time", "by-module"); render(); };
$("by-module").onclick = () => { view = "module"; setSeg("by-module", "by-time"); render(); };
$("newest").onclick = () => { newestFirst = true; setSeg("newest", "oldest"); render(); };
$("oldest").onclick = () => { newestFirst = false; setSeg("oldest", "newest"); render(); };
const syncTab = asTab("iterations");
$("d-close").onclick = () => { history.replaceState(null, "", location.pathname + location.search); syncTab?.(); showCommit(null); };
window.addEventListener("hashchange", () => showCommit(location.hash.slice(1)));

if (syncTab && requireToken($("root"))) {
  api("/api/iterations").then((d) => {
    data = d;
    render();
    if (location.hash) showCommit(location.hash.slice(1));
  }).catch((e) => $("list").replaceChildren(el("div", "err-text", "读取迭代记录失败：" + e.message)));
}
</script>
</body>
</html>
