<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 584" role="img" aria-labelledby="overview-title overview-desc" id="overview-root">


  <title id="overview-title">系统总览</title>


  <desc id="overview-desc">开发者从终端或浏览器驱动本地 Node.js Agent，调用模型与工作区工具，并保存会话。</desc>


  <defs>
      <style>#overview-root { color: #26251f; }
      #overview-root a { color: #1d7a75; }
      #overview-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#overview-root .diagram-container { overflow-x: visible; }
}</style>
    <marker id="overview-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#6e6b5e"/>
    </marker>
    <marker id="overview-link" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#1d7a75"/>
    </marker>
    <marker id="overview-accent" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#8f5c00"/>
    </marker>
    <marker id="overview-open" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M 0 0 L 8 4 L 0 8" fill="none" stroke="#6e6b5e" stroke-width="1.5"/>
    </marker>
  </defs>


  <rect width="720" height="584" fill="#f6f5f0"/>


